# Add these directives inside the local VirtualHost in
# C:/xampp/apache/conf/extra/httpd-vhosts.conf, then restart Apache.
# Replace placeholders locally; never commit real credentials.
SetEnv SMTP_HOST "smtp.gmail.com"
SetEnv SMTP_PORT "587"
SetEnv SMTP_USERNAME "your-email@gmail.com"
SetEnv SMTP_PASSWORD "your-google-app-password"
SetEnv SMTP_ENCRYPTION "tls"
SetEnv SMTP_FROM_EMAIL "your-email@gmail.com"
SetEnv SMTP_FROM_NAME "ArgiConnect"
SetEnv SMTP_TIMEOUT "15"
SetEnv APP_ENV "production"
SetEnv OTP_DEV_LOG "false"
SetEnv OTP_DEV_SHOW "false"
